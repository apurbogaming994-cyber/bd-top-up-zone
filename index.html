<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Top UP Zone</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f5f9;
      color: #17202a;
    }

    .header {
      background: #1687f5;
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 24px 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .container {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0 14px;
    }

    .packages {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .package {
      background: white;
      border: 2px solid transparent;
      border-radius: 17px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      cursor: pointer;
    }

    .package.selected {
      border-color: #1687f5;
      background: #eaf5ff;
    }

    .diamond {
      font-size: 31px;
    }

    .package h3 {
      margin: 8px 0 5px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #1687f5;
    }

    .order-box {
      background: white;
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      border: 1px solid #d5dbe1;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .btn {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      background: #1687f5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(.98);
    }

    .status {
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #777;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

  </div>
